name: Build on Linux
description: Configure with CMake in a build directory and build

inputs:
  cmake-options:
    description: CMake options, one per line; shell expressions such as $(which python3) are expanded
    default: ""

runs:
  using: composite

  steps:
    - name: Configure CMake
      shell: bash
      # cmake-options is interpolated into the script on purpose so $(...) inside it is expanded by the shell.
      # This is a local action: inputs come only from workflow files in this repo. Never pass untrusted input here.
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{env.LRS_RUN_CONFIG}} \
          ${{ inputs.cmake-options }}

    - name: Build
      shell: bash
      run: |
        cd build
        cmake --build . -- -j$(nproc)
