name: Pre-build checks
description: Run the API check script, and optionally the PR check script

inputs:
  pr-check:
    description: Also run pr_check.sh
    default: "false"

runs:
  using: composite

  steps:
    - shell: bash
      env:
        PR_CHECK: ${{ inputs.pr-check }}
      run: |
        cd scripts
        ./api_check.sh

        if [ "$PR_CHECK" = "true" ]; then
            ./pr_check.sh
        fi
