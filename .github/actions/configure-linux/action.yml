name: Configure Linux
description: Create the build directory and run the CMake configure step

inputs:
  cmake-options:
    description: Additional CMake options, one per line; shell expressions such as $(which python3) are expanded
    default: ""

runs:
  using: composite

  steps:
    - name: Configure CMake
      shell: bash
      # cmake-options is interpolated into the script on purpose so $(...) inside it is expanded by the shell
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{env.LRS_RUN_CONFIG}} \
          ${{ inputs.cmake-options }}
