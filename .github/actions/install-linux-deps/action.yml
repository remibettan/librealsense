name: Install Linux dependencies

inputs:
  apt-packages:
    default: ""

  pip-packages:
    default: ""

runs:
  using: composite

  steps:
    - shell: bash
      run: |
        sudo apt-get update

        sudo apt-get install -qq \
            build-essential \
            xorg-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglew-dev \
            libglm-dev \
            libusb-1.0-0-dev \
            libgtk-3-dev \
            libglfw3-dev \
            libglfw3

        if [ -n "${{ inputs.apt-packages }}" ]; then
            sudo apt-get install ${{ inputs.apt-packages }}
        fi

        if [ -n "${{ inputs.pip-packages }}" ]; then
            python3 -m pip install ${{ inputs.pip-packages }}
        fi
