plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.realsense_native_example'
    compileSdk 36
    ndkVersion '28.2.13676358'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.example.realsense_native_example"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-fexceptions"
                abiFilters 'arm64-v8a', 'x86_64'
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // librealsense dependency: copy the AAR built from <librealsense>/wrappers/android into app/libs
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

// The native code links against librealsense2.so, extracted from the AAR in app/libs
tasks.register('extractSo', Sync) {
    from fileTree(dir: 'libs', include: ['*.aar']).files.collect { zipTree(it) }
    include("jni/**")
    into layout.buildDirectory.dir("librealsense")
}

preBuild.dependsOn(extractSo)
