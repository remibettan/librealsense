// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'com.android.library' version '8.13.0' apply false
}

ext {
    // Android 16 (API 36). Apps built from this project target it and run on it and newer.
    defaultCompileSdkVersion = 36
    defaultTargetSdkVersion = 36
    defaultMinSdkVersion = 24

    // NDK r28 and newer emit 16 KB page-aligned libraries, required by Android 15+/16 devices.
    defaultNdkVersion = '28.2.13676358'
    defaultCmakeVersion = '3.22.1'

    appcompatVersion = '1.7.1'
    activityVersion = '1.10.1'
    coreVersion = '1.17.0'
    constraintlayoutVersion = '2.2.1'
    materialVersion = '1.13.0'
    recyclerviewVersion = '1.4.0'

    junitVersion = '4.13.2'
    androidextjunitVersion = '1.3.0'
    espressoCoreVersion = '3.7.0'
}
